<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talk Translator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff8ec;--card:#ffffff;--ink:#1b1b1b;--a:#0b5fff;--b:#0a7a3d;--btnink:#ffffff;--line:#d9cdb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120e;--card:#211e18;--ink:#f5efe2;--a:#7fb0ff;--b:#6fdc9a;--btnink:#0b0b0b;--line:#3d372b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120e;--card:#211e18;--ink:#f5efe2;--a:#7fb0ff;--b:#6fdc9a;--btnink:#0b0b0b;--line:#3d372b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;line-height:1.35}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:6px 0 10px;text-align:center}
#status{font-size:26px;font-weight:700;text-align:center;padding:14px;border-radius:16px;background:var(--card);border:3px solid var(--line);margin-bottom:16px;min-height:72px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.a{--c:var(--a)}.panel.b{--c:var(--b)}
label{font-weight:700;font-size:20px}
select{width:100%;font-size:24px;padding:14px;border-radius:12px;border:3px solid var(--c);background:var(--card);color:var(--ink)}
.talk{font-size:30px;font-weight:800;padding:34px 12px;border:0;border-radius:20px;background:var(--c);color:var(--btnink);cursor:pointer;min-height:130px}
.talk:active{transform:scale(.98)}
.talk.on{outline:6px solid var(--ink);animation:p 1s infinite}
@keyframes p{50%{opacity:.7}}
.out{min-height:110px;padding:12px;border-radius:12px;border:2px dashed var(--line);font-size:28px;font-weight:600;word-break:break-word}
.out small{display:block;font-size:17px;font-weight:600;opacity:.75;margin-bottom:4px}
details{font-size:20px}summary{cursor:pointer;padding:8px 0;font-weight:700}input[type=text]{width:100%;font-size:24px;padding:12px;margin:6px 0;border-radius:12px;border:3px solid var(--c);background:var(--card);color:var(--ink)}
.again{font-size:22px;padding:14px;border-radius:14px;border:3px solid var(--c);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>🗣️ Talk Translator</h1>
<div id="status" role="status" aria-live="polite">Choose the languages, then press a big button and speak.</div>
<div class="grid">
  <section class="panel a">
    <label for="l0">Person 1 speaks:</label>
    <select id="l0"></select>
    <button class="talk" id="t0">🎤 Press &amp; speak</button>
    <details><summary>⌨️ Type instead</summary>
      <input id="x0" type="text" dir="auto" placeholder="Type here…"><button class="again" id="s0">Translate</button>
    </details>
    <div class="out" id="o0" dir="auto"><small>They said / translation</small><span></span></div>
    <button class="again" id="r0">🔊 Hear again</button>
  </section>
  <section class="panel b">
    <label for="l1">Person 2 speaks:</label>
    <select id="l1"></select>
    <button class="talk" id="t1">🎤 Press &amp; speak</button>
    <details><summary>⌨️ Type instead</summary>
      <input id="x1" type="text" dir="auto" placeholder="Type here…"><button class="again" id="s1">Translate</button>
    </details>
    <div class="out" id="o1" dir="auto"><small>They said / translation</small><span></span></div>
    <button class="again" id="r1">🔊 Hear again</button>
  </section>
</div>
</main>
<script>
const LANGS=[
["en-US","English","English"],["mt-MT","Malti","Maltese"],["hi-IN","हिन्दी","Hindi"],["zh-CN","中文 普通话","Chinese (Mandarin)"],
["uk-UA","Українська","Ukrainian"],["cs-CZ","Čeština","Czech"],["de-DE","Deutsch","German"],["fi-FI","Suomi","Finnish"],
["pl-PL","Polski","Polish"],["ar-SA","العربية","Arabic"],["fr-FR","Français","French"],["es-ES","Español","Spanish"],
["it-IT","Italiano","Italian"],["pt-PT","Português","Portuguese"],["ru-RU","Русский","Russian"],["tr-TR","Türkçe","Turkish"],
["el-GR","Ελληνικά","Greek"],["nl-NL","Nederlands","Dutch"],["sv-SE","Svenska","Swedish"],["da-DK","Dansk","Danish"],
["nb-NO","Norsk","Norwegian"],["ro-RO","Română","Romanian"],["hu-HU","Magyar","Hungarian"],["bg-BG","Български","Bulgarian"],
["sk-SK","Slovenčina","Slovak"],["hr-HR","Hrvatski","Croatian"],["he-IL","עברית","Hebrew"],["fa-IR","فارسی","Persian"],
["ur-PK","اردو","Urdu"],["bn-BD","বাংলা","Bengali"],["th-TH","ไทย","Thai"],["vi-VN","Tiếng Việt","Vietnamese"],
["id-ID","Bahasa Indonesia","Indonesian"],["ja-JP","日本語","Japanese"],["ko-KR","한국어","Korean"]];
const $=id=>document.getElementById(id);
const sel=[$("l0"),$("l1")], out=[$("o0").lastElementChild,$("o1").lastElementChild];
const name=c=>LANGS.find(l=>l[0]===c)[2];
sel.forEach((s,i)=>{
  LANGS.forEach(l=>s.add(new Option(l[1]+" ("+l[2]+")",l[0])));
  let saved=null; try{saved=localStorage.getItem("tt-l"+i)}catch(e){}
  s.value=saved&&LANGS.some(l=>l[0]===saved)?saved:(i?"ar-SA":"en-US");
  s.onchange=()=>{try{localStorage.setItem("tt-l"+i,s.value)}catch(e){}};
});
const status=m=>{$("status").textContent=m};
let sampleFn=null, busy=false, lastText=["",""], lastLang=["",""];
if(window.claude&&claude.use){claude.use("sample").then(s=>{sampleFn=s}).catch(()=>{})}

// Paste your Cloudflare Worker URL here (see worker.js), e.g. "https://translate.yourname.workers.dev"
const WORKER_URL="";

async function translate(text,from,to){
  if(WORKER_URL){
    try{
      const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,from,to})});
      if(r.ok){const j=await r.json(); if(j&&j.text) return j.text;}
    }catch(e){}
  }
  if(sampleFn){
    try{
      const r=await sampleFn("Translate the following text from "+name(from)+" to "+name(to)+". Reply with ONLY the translation, nothing else.\n\n"+text,{cache:false,modelTier:"quick"});
      if(r&&r.text) return r.text.trim();
    }catch(e){}
  }
  try{
    const g=c=>({zh:"zh-CN",nb:"no",he:"iw"}[c.slice(0,2)]||c.slice(0,2));
    const gr=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+g(from)+"&tl="+g(to)+"&q="+encodeURIComponent(text));
    if(gr.ok){const gj=await gr.json(); const t=gj[0].map(x=>x[0]).join(""); if(t) return t;}
  }catch(e){}
  const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+from.slice(0,2)+"|"+to.slice(0,2));
  const j=await r.json();
  if(j&&j.responseData&&j.responseData.translatedText) return j.responseData.translatedText;
  throw new Error("no translation");
}

function speak(text,lang){
  if(!("speechSynthesis" in window)) return Promise.resolve(false);
  speechSynthesis.cancel();
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=0.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
    if(v) u.voice=v;
    u.onend=()=>res(!!v); u.onerror=()=>res(false);
    speechSynthesis.speak(u);
  });
}

async function handle(side,heard){
  const other=1-side, from=sel[side].value, to=sel[other].value;
  if(from===to){status("Please choose two different languages.");return;}
  busy=true;
  out[side].textContent=heard;
  status("Translating…");
  try{
    const tr=await translate(heard,from,to);
    out[other].textContent=tr; lastText[other]=tr; lastLang[other]=to;
    status("Speaking…");
    const ok=await speak(tr,to);
    status(ok?"Done. Press a button to talk again.":"The translation is on the screen. (This device has no voice for "+name(to)+".)");
  }catch(err){status("Sorry, the translation did not work. Please try again.");}
  busy=false;
}

function listen(side){
  if(busy) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){status("Please open this page in Chrome or Safari so the microphone works.");return;}
  const other=1-side, from=sel[side].value, to=sel[other].value;
  if(from===to){status("Please choose two different languages.");return;}
  speechSynthesis.cancel();
  const r=new SR(); r.lang=from; r.interimResults=false; r.maxAlternatives=1;
  const btn=$("t"+side); let got=false;
  busy=true; btn.classList.add("on"); btn.textContent="🎤 Listening…";
  status("Listening… speak now.");
  r.onresult=async e=>{got=true; await handle(side,e.results[0][0].transcript);};
  r.onerror=e=>{
    got=true; busy=false;
    status(e.error==="not-allowed"||e.error==="service-not-allowed"
      ?"Please allow the microphone when the browser asks."
      :e.error==="no-speech"?"I did not hear anything. Please try again.":"Sorry, I could not listen. Please try again.");
  };
  r.onend=()=>{
    btn.classList.remove("on"); btn.textContent="🎤 Press & speak";
    if(!got){busy=false;status("I did not hear anything. Please try again.");}
  };
  try{r.start()}catch(e){busy=false;btn.classList.remove("on");btn.textContent="🎤 Press & speak";}
}
[0,1].forEach(i=>{
  $("t"+i).onclick=()=>listen(i);
  $("r"+i).onclick=()=>{ if(lastText[i]) speak(lastText[i],lastLang[i]); };
  $("s"+i).onclick=()=>{ const v=$("x"+i).value.trim(); if(v&&!busy) handle(i,v); };
});
if("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
</body>
</html>
